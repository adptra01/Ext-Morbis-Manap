name: Deploy dist to main

on:
  push:
    branches: [dev]

# Satu deploy dalam satu waktu (writeback bump versi di bawah tidak balapan).
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Bump patch OTOMATIS tiap deploy (syarat Store: versi harus naik agar
      # Edge ikut terupdate). Writeback [skip ci] → tidak memicu deploy lagi.
      - name: Bump patch version
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          for i in 1 2 3; do
            git fetch origin dev
            git reset --hard origin/dev
            OLD=$(jq -r .version manifest.json)
            NEW=$(node -e "const p=process.argv[1].split('.').map(Number);console.log(p[0]+'.'+p[1]+'.'+(p[2]+1))" "$OLD")
            jq --arg v "$NEW" '.version=$v' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
            git add manifest.json
            git commit -m "chore: bump version to $NEW [skip ci]" || break
            if git push origin HEAD:dev; then
              echo "VERSION=$NEW" >> $GITHUB_ENV
              VERSION="$NEW"
              break
            fi
            echo "push ditolak (balapan), coba lagi ($i/3)..."
            sleep 5
          done
          test -n "${VERSION:-}" || { echo "::error::bump versi gagal"; exit 1; }
          echo "Versi deploy: $VERSION"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build extension (production)
        env:
          NODE_ENV: production
        run: npm run build

      # Feature audit: pastikan registrasi fitur (id/match/run) sinkron dengan
      # matrix regresi - gagalkan job bila meleset (scripts/audit-features.mjs).
      - name: Audit features
        run: npm run audit

      # Auto-update enterprise mesin farmasi: CRX3 signed + update.xml.
      # Key .pem dari secret CRX_SIGNING_KEY (tidak pernah masuk repo).
      # --require-key → gagal keras kalau secret hilang, agar auto-update
      # tidak senyap berhenti bekerja.
      - name: Pack CRX signed + update.xml
        env:
          CRX_SIGNING_KEY: ${{ secrets.CRX_SIGNING_KEY }}
        run: |
          printf '%s' "$CRX_SIGNING_KEY" > "$RUNNER_TEMP/crx-signing-key.pem"
          node scripts/pack.mjs --key "$RUNNER_TEMP/crx-signing-key.pem" --require-key | tee "$RUNNER_TEMP/pack.log"
          # Guard: EXT_ID di .bat + appid update.xml + versi harus sinkron
          # dengan ID yang dihitung dari key signing (sumber tunggal).
          CRX_EXT_ID=$(grep -oP '(?<=\[pack\] EXT_ID: )[a-p]{32}' "$RUNNER_TEMP/pack.log" | head -1)
          test -n "$CRX_EXT_ID" || { echo "::error::gagal membaca EXT_ID dari pack.mjs"; exit 1; }
          echo "CRX_EXT_ID=$CRX_EXT_ID" >> $GITHUB_ENV
          grep -q "set EXT_ID=$CRX_EXT_ID" deploy/Install_Morbis_Ext.bat || { echo "::error::EXT_ID di .bat tidak sinkron dengan key signing (pack=$CRX_EXT_ID)"; exit 1; }
          grep -q "appid='$CRX_EXT_ID'" deploy/update.xml || { echo "::error::appid update.xml tidak sinkron dengan key signing"; exit 1; }
          XML_VER=$(grep -oP "updatecheck codebase='[^']*' version='\K[0-9.]+" deploy/update.xml | head -1)
          test "$XML_VER" = "$VERSION" || { echo "::error::versi update.xml ($XML_VER) != manifest ($VERSION)"; exit 1; }
          echo "Guard OK: EXT_ID=$CRX_EXT_ID, update.xml v$XML_VER"

      # Guard ke-4 (sebelum commit deploy): jangan pernah menyebarkan private
      # key (.pem) ke main/Pages - CRX sudah ditandatangani CI pakai secret.
      # (nilai name di-quote: colon+spasi di compact mapping membuat
      # prettier/yaml gagal parse → pre-commit lint-staged menolak.)
      - name: 'Guard: no .pem in deploy payload'
        run: |
          find deploy dist -name '*.pem' | grep -q . && { echo "::error::Private key would be deployed"; exit 1; } || true

      - name: Deploy dist + docs → main (orphan-style)
        run: |
          # Create orphan branch state — dist contents at root + docs for GitHub Pages
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          ORPHAN=$(mktemp -d)
          cp -r dist/* "$ORPHAN/"
          cp README.md "$ORPHAN/README.md"
          cp -r docs "$ORPHAN/docs"
          # Auto-update enterprise → Pages: update.xml + CRX signed di docs/
          # (docs/ = akar situs Pages sehingga URL persis seperti di .bat).
          cp deploy/update.xml "$ORPHAN/docs/update.xml"
          cp "deploy/morbis-v${VERSION}.crx" "$ORPHAN/docs/morbis-v${VERSION}.crx"
          # Installer siap pakai ikut ke main (1 domain Pages) — sinkron
          # EXT_ID sudah dijaga step Pack di atas, tanpa inject/sed.
          cp deploy/Install_Morbis_Ext.bat deploy/Setup_Update_Terjadwal.bat deploy/Uninstall_Morbis_Ext.bat "$ORPHAN/docs/"
          # Script update satu-klik ikut ke main (branch main = dist siap pakai)
          cp scripts/morbis-update-main.bat "$ORPHAN/morbis-update-main.bat"

          cat > "$ORPHAN/.gitignore" << 'EOF'
          # main branch — extension files at root + docs for GitHub Pages
          /*
          !.gitignore
          !README.md
          !manifest.json
          !background.js
          !core.js
          !init.js
          !popup.js
          !sidepanel.html
          !sidepanel.js
          !popup/
          !popup/**
          !assets/
          !assets/**
          !chunks/
          !chunks/**
          !features/
          !features/**
          !icons/
          !icons/**
          !rules/
          !rules/**
          !ui/
          !ui/**
          !docs/
          !docs/**
          !morbis-update-main.bat
          EOF

          cd "$ORPHAN"
          git init
          git add -A
          git commit -m "deploy: v${VERSION:-unknown} ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:main --force

  # Pages tayang dari bit main yang BARU di-push di atas (bukan dari dev) —
  # jadi privacy.html dkk selalu mencerminkan hasil deploy.
  pages:
    needs: [deploy]
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

  # Store Edge: tiap update main (bit identik dengan .bat unpacked).
  publish-edge:
    needs: [deploy]
    uses: ./.github/workflows/publish-edge.yml
    secrets: inherit
