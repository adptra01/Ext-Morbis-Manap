name: Deploy dist to main

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Kredensial Telegram (bot token + chat ID) TIDAK pernah di-commit —
      # di-inject dari GitHub Secrets saat CI build. Tanpa keduanya, build
      # tetap sukses dengan token kosong → logging remote non-aktif.
      - name: Build extension (production)
        env:
          NODE_ENV: production
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run build

      - name: Deploy dist + docs → main (orphan-style)
        run: |
          # Create orphan branch state — dist contents at root + docs for GitHub Pages
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          ORPHAN=$(mktemp -d)
          cp -r dist/* "$ORPHAN/"
          cp README.md "$ORPHAN/README.md"
          cp -r docs "$ORPHAN/docs"

          cat > "$ORPHAN/.gitignore" << 'EOF'
          # main branch — extension files at root + docs for GitHub Pages
          /*
          !.gitignore
          !README.md
          !manifest.json
          !background.js
          !core.js
          !init.js
          !popup.js
          !sidepanel.html
          !sidepanel.js
          !popup/
          !popup/**
          !assets/
          !assets/**
          !chunks/
          !chunks/**
          !features/
          !features/**
          !icons/
          !icons/**
          !rules/
          !rules/**
          !ui/
          !ui/**
          !docs/
          !docs/**
          EOF

          cd "$ORPHAN"
          git init
          git add -A
          git commit -m "deploy: $(date -u +'%Y-%m-%d %H:%M UTC')"

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:main --force
