<html>
  <head>
    <title>Input Hasil PA (uji keep-case)</title>
  </head>
  <body>
    <form id="form-pa">
      <div class="form-group">
        <label>Dokter Pengirim (Luar)</label>
        <input type="text" name="dok_luar" value="" />
      </div>
      <div class="form-group">
        <label>RS Asal</label>
        <input type="text" name="nama_rs" value="" />
      </div>
      <button type="button" id="btn-save">Simpan</button>
    </form>
    <script>
      // Simulasi handler halaman asli: camelcase ala ucwords(strtolower)
      // lalu simpan via XHR POST control/pemeriksaan-pa.
      function camel(s) {
        return s
          .toLowerCase()
          .split(' ')
          .map(function (w) {
            return w.charAt(0).toUpperCase() + w.slice(1);
          })
          .join(' ');
      }
      // Kasus terburuk: rewrite saat blur via document-capture (terdaftar
      // SEBELUM extension) + rewrite ulang saat klik simpan.
      document.addEventListener(
        'focusout',
        function (e) {
          var t = e.target;
          if (t && t.matches && t.matches('[name="dok_luar"], [name="nama_rs"]')) {
            t.value = camel(t.value);
          }
        },
        true,
      );
      document.getElementById('btn-save').addEventListener('click', function () {
        ['dok_luar', 'nama_rs'].forEach(function (n) {
          var el = document.querySelector('[name="' + n + '"]');
          if (el) el.value = camel(el.value);
        });
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/laboratorium/input-hasil/control/pemeriksaan-pa');
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
        var body =
          'id_lab=154696&dok_luar=' +
          encodeURIComponent(document.querySelector('[name="dok_luar"]').value) +
          '&nama_rs=' +
          encodeURIComponent(document.querySelector('[name="nama_rs"]').value);
        xhr.send(body);
      });
    </script>
  </body>
</html>
